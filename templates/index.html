<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat</title>
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1220 0%, #071124 100%);
            color: #e6eef8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Chat container */
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 600px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 12px 40px rgba(2,6,23,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(90deg, #0f1724 0%, #0b1220 100%);
            color: #e6eef8;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(180deg, #071124 0%, #081221 100%);
        }

        /* Messages */
        .message { margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
        .message.user { flex-direction: row-reverse; }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
            color: #e6eef8;
        }

        /* User (right) bubble */
        .message.user .message-bubble {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 18px rgba(124,58,237,0.18);
        }

        /* Bot (left) bubble */
        .message.bot .message-bubble {
            background: linear-gradient(180deg, #0f1724 0%, #111827 100%);
            color: #cbd5e1;
            border-bottom-left-radius: 4px;
            box-shadow: 0 3px 12px rgba(2,6,23,0.6);
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* Avatars */
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0;
        }

        .message.user .avatar { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff; }
        .message.bot .avatar { background: #0b1220; color: #9ca3af; border: 1px solid rgba(255,255,255,0.02); }

        /* Typing indicator */
        .typing-dots { display: inline-flex; gap: 6px; padding: 8px 12px; }
        .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; animation: bounce 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(1) { animation-delay: -0.24s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.12s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }

        /* Input area */
        .chat-input-area { padding: 16px; background: linear-gradient(180deg, #071124, #07121a); border-top: 1px solid rgba(255,255,255,0.03); display: flex; gap: 12px; }

        #userInput {
            flex: 1; padding: 12px 16px; border: 2px solid rgba(255,255,255,0.04); border-radius: 24px; font-size: 15px; outline: none; transition: border-color 0.2s; background: rgba(255,255,255,0.02); color: #e6eef8;
        }
        #userInput::placeholder { color: #9ca3af; }
        #userInput:focus { border-color: rgba(99,102,241,0.9); box-shadow: 0 6px 20px rgba(99,102,241,0.06); }

        /* Buttons */
        #sendBtn { padding: 12px 24px; background: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%); color: white; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; box-shadow: 0 6px 18px rgba(124,58,237,0.18); }
        #sendBtn:hover { transform: translateY(-2px); }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        #stopBtn { padding: 12px 24px; background: #b91c1c; color: white; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.12s; display: none; }

        /* Scrollbar (webkit) */
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.04); border-radius: 99px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 Gemini AI Chat
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="avatar">G</div>
                <div class="message-bubble">Hi! I'm Gemini. Ask me anything!</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn">Send</button>
            <button id="stopBtn">Stop</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        let isProcessing = false;
        let stopTyping = false;

        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'U' : 'G';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
            
            return bubble;
        }

        function showTyping() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.id = 'typing';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'G';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function typeText(element, text) {
            element.textContent = '';
            stopTyping = false;
            stopBtn.style.display = 'inline-block';
            sendBtn.style.display = 'none';
            
            for (let i = 0; i < text.length; i++) {
                if (stopTyping) {
                    element.textContent += '...';
                    break;
                }
                element.textContent += text[i];
                scrollToBottom();
                await new Promise(resolve => setTimeout(resolve, 30));
            }
            
            stopBtn.style.display = 'none';
            sendBtn.style.display = 'inline-block';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isProcessing) return;

            addMessage(message, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            isProcessing = true;

            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeTyping();

                if (data.response) {
                    const bubble = addMessage('', false);
                    await typeText(bubble, data.response);
                } else {
                    addMessage(data.error || 'Sorry, something went wrong.', false);
                }
            } catch (error) {
                removeTyping();
                addMessage('Error connecting to server.', false);
            } finally {
                isProcessing = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', () => {
            stopTyping = true;
        });
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>
</html>
